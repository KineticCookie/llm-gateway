server:
  host: "0.0.0.0"
  port: 8080

upstream:
  # Base URL of your llama.cpp or OpenAI-compatible server (no /v1 suffix)
  url: "http://localhost:8080"
  # Optional: API key sent to upstream. If not set, the client's key is forwarded.
  api_key: null

# Number of llama.cpp inference slots (--parallel N in llama-server)
slots: 8

# Default request timeout (queue wait + inference). Supports: 30s, 5m, 1h
default_timeout: 5m

# What to do with requests that have no matching API key.
# "reject" returns 403. Or set to a project name to route them there.
unauthenticated: reject

projects:
  # Tier 1 — highest importance, always served first
  production:
    priority: 1
    share: 1        # only project at this tier, share is irrelevant
    max_slots: 8    # can use all slots if needed (defaults to global slots)
    timeout: 30s    # tight timeout for live traffic
    api_keys:
      - "sk-prod-xxx"

  # Tier 2 — only gets slots when tier 1 queue is empty
  staging:
    priority: 2
    share: 1
    max_slots: 4
    timeout: 2m
    api_keys:
      - "sk-staging-xxx"

  # Tier 3 — background/batch work, runs when nothing else is waiting
  testing:
    priority: 3
    share: 1
    max_slots: 2
    timeout: 10m
    api_keys:
      - "sk-test-xxx"

# Example: two projects sharing the same priority tier
# They compete for slots weighted by share (2:1 ratio = ~67% / ~33%)
