global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'llm-gateway'
    static_configs:
      - targets: ['proxy:12345']
    metrics_path: '/metrics'
    scrape_interval: 1s
    scrape_timeout: 1s
