services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8080:8080"
    environment:
      - HF_HOME=/hf-cache
    volumes:
      - ./models:/hf-cache
    command: >
      --hf-repo unsloth/gemma-3-1b-it-GGUF
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      --parallel 4
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 120s
